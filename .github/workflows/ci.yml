name: Kairos103 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Kairos103.slnx

    - name: Build
      run: dotnet build Kairos103.slnx --no-restore --configuration Release

    - name: Test
      run: |
        dotnet test tests/Kairos103.Tests/Kairos103.Tests.csproj --configuration Release --logger "trx;LogFileName=test_results.trx" || {
          find . -name "*.trx" -exec cat {} +
          exit 1
        }

    - name: Run Fast Benchmark
      run: dotnet run --project src/Kairos103.Cli --configuration Release -- benchmark --fast

    - name: Run Jitter Sweep
      run: dotnet run --project src/Kairos103.Cli --configuration Release -- jitter-sweep

    - name: Validate Self-Contained Linux Publish
      run: dotnet publish src/Kairos103.Cli/Kairos103.Cli.csproj -c Release -r linux-x64 --self-contained true -o ./publish-linux

    - name: Smoke Test Published Binary
      run: ./publish-linux/Kairos103.Cli --help

  docker-build-and-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Container
      run: docker build -t kairos103-ci -f deploy/Dockerfile .

    - name: Smoke Test Container Help
      run: docker run --rm kairos103-ci --help

    - name: Smoke Test Container Fast Benchmark
      run: docker run --rm kairos103-ci benchmark --fast
