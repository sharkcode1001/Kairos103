name: Kairos103 CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Kairos103.slnx

    - name: Build
      run: dotnet build Kairos103.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test Kairos103.slnx --no-build --configuration Release --verbosity normal

    - name: Run Fast Benchmark
      run: dotnet run --project src/Kairos103.Cli --configuration Release -- benchmark --fast

    - name: Run Jitter Sweep
      run: dotnet run --project src/Kairos103.Cli --configuration Release -- jitter-sweep
